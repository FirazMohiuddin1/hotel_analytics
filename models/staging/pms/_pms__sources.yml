version: 2

sources:
  - name: pms
    description: Property management system feed, landed in HOTEL_RAW.PMS.
    database: HOTEL_RAW
    schema: PMS
    tables:
      - name: properties
        description: One row per hotel.
        columns:
          - name: property_id
            data_tests: [unique, not_null]

      - name: guests
        description: One row per guest profile. Contains PII.
        columns:
          - name: guest_id
            data_tests: [unique, not_null]

      - name: reservations
        description: The booking as originally made.
        columns:
          - name: reservation_id
            data_tests: [unique, not_null]

      - name: reservation_events
        description: Append-only lifecycle log, one row per event.
        config:
          loaded_at_field: ingested_at
          freshness:
            warn_after: {count: 1, period: hour}
            error_after: {count: 24, period: hour}
        columns:
          - name: event_id
            data_tests: [unique, not_null]